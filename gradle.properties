group = com.pauldillon.webchathelper
version = 0.1.0

# Target IntelliJ IDEA version (build 263.x requires Java 25)
platformVersion = 2026.3
pluginSinceBuild = 263

# Optional: build and run against an installed IDE instead of downloading platformVersion.
# Remove or leave blank to download.
platformLocalPath = C:/Program Files/JetBrains/IntelliJ IDEA 2026.3

# The IDE provides the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
