group = com.pauldillon.webchathelper
version = 0.1.0

# Oldest supported IntelliJ IDEA (build 251.x, Java 21). The plugin is compiled against this version
# so that the one zip also runs on newer IDEs.
platformVersion = 2025.1.1.1
pluginSinceBuild = 251

# Optional: build and run against an installed IDE instead of downloading platformVersion.
# Remove or leave blank to download.
platformLocalPath =

# Optional: an installed newer IDE to also check the plugin against. Adds the runIdeLatest task and
# includes that IDE in verifyPlugin. Ignored on machines where this folder doesn't exist.
latestIdeLocalPath = C:/Program Files/JetBrains/IntelliJ IDEA 2026.3

# The IDE provides the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
